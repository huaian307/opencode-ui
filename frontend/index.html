<!doctype html>
<html lang="zh-CN" data-theme="hiru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絵梨衣 · OpenCode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13.5' fill='%23faf7f2' stroke='%23c8102e' stroke-width='2'/%3E%3Cpath d='M16 25.5V9' stroke='%23c8102e' stroke-width='2.2'/%3E%3Cpath d='M16 13.5c3-.6 4.4-2.2 5-4.2M16 17.5c3.4-.5 5-1.8 5.8-3.8M16 13.5c-3-.6-4.4-2.2-5-4.2' stroke='%23a8842c' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v=260924p">
</head>
<body>
<!-- 半朽的世界树（卡塞尔学院校徽）：左半枯枝、右半生叶 —— 龙族的标志性意象，纯内联 SVG -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mk-tree" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10.4" fill="none" stroke="currentColor" stroke-width=".9" opacity=".5"/>
    <path d="M12 20.2V9.2" stroke="currentColor" stroke-width="1.15" fill="none" stroke-linecap="round"/>
    <path d="M12 12.6c2-.4 3-1.4 3.6-3M12 15c2.4-.3 3.6-1.2 4.4-2.6M12 9.7c1.5-.3 2.5-1 3.1-2.2"
          stroke="currentColor" stroke-width=".95" fill="none" stroke-linecap="round"/>
    <circle cx="16.3" cy="8.5" r="1.45" fill="currentColor" opacity=".8"/>
    <circle cx="17.6" cy="12.1" r="1.15" fill="currentColor" opacity=".65"/>
    <circle cx="15.7" cy="15.4" r=".95" fill="currentColor" opacity=".55"/>
    <path d="M12 12.6c-2-.4-3-1.4-3.6-3M12 15c-2.4-.3-3.6-1.2-4.4-2.6M12 9.7c-1.5-.3-2.5-1-3.1-2.2"
          stroke="currentColor" stroke-width=".95" fill="none" opacity=".65" stroke-linecap="round"/>
    <path d="M6.8 20.2h10.4" stroke="currentColor" stroke-width=".9" opacity=".45"/>
  </symbol>
</svg>
<div id="petals" aria-hidden="true"></div>

<!-- 动态壁纸：收起侧栏时缓慢启动、展开时缓慢停下；
     停住的那一帧**就是**会话界面的静态背景（直接暂停视频，不再截图） -->
<div id="static-bg" aria-hidden="true">
  <div class="sb" data-bg="hiru"></div>
  <div class="sb" data-bg="yoru"></div>
</div>

<div id="live-bg" aria-hidden="true">
  <video id="live-video" class="lb-video" muted loop playsinline preload="metadata"></video>
  <video id="live-video2" class="lb-video" muted loop playsinline preload="metadata"></video>
  <div class="lb-wash"></div>
</div>

<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <div class="name">
        <img class="avatar-brand" src="/assets/badge.jpg" alt="絵梨衣"
             title="絵梨衣 · 同人图，仅本地自用">
        <span id="brand-name" title="点一下可以改名字（回车保存，Esc 取消）">絵梨衣</span>
      </div>
      <div class="sub">落尽红樱君不见，轻绘梨花泪沾衣</div>
    </div>

    <div class="side-head">
      <button id="btn-new" class="primary" title="新建会话">＋ 新会话</button>
      <input id="search" type="search" placeholder="搜索会话…" autocomplete="off">
    </div>

    <nav id="session-list" aria-label="会话列表"></nav>

    <div class="side-foot">
      <span id="conn" class="dot offline" title="事件流状态"></span>
      <span id="conn-text">未连接</span>
      <span id="ui-ver" class="muted"></span>
      <span id="upstream" class="muted"></span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="btn-sidebar" title="收起 / 展开（Ctrl+B）" aria-label="切换侧栏">☰</button>
      <div class="title-wrap">
        <h1 id="session-title">未选择会话</h1>
        <div id="session-meta" class="muted"></div>
      </div>
      <div class="actions">
        <button id="btn-model" class="mdl-btn" title="切换模型（对当前会话生效）" aria-label="切换模型">模型</button>
        <button id="btn-cfg" title="设置（亮度 / 毛玻璃 / 壁纸 / 落樱 …）" aria-label="设置"><svg class="ico-gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
        <button id="btn-theme" title="昼（白衣绯袴）/ 夜（黑纹付羽织·黄金瞳）" aria-label="切换昼夜">夜</button>
        <button id="btn-refresh" title="重新加载消息" aria-label="重新加载消息">↻</button>
        <button id="btn-stop" class="danger" title="中断当前生成" aria-label="中断当前生成" disabled>■</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section id="messages" aria-live="polite">
      <div id="msg-static">
        <div class="error-box">界面脚本没加载成功 —— 请按 Ctrl+Shift+R 强制刷新。</div>
      </div>
      <div id="live-slot"></div>
    </section>

    <div id="player" class="player">
      <div class="p-bg" aria-hidden="true"></div>
      <div class="p-row">
        <div class="p-vis" id="p-vis" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="p-info">
          <b id="p-title">未在播放</b><i id="p-artist"></i>
        </div>
        <div class="p-ctrl">
          <button id="p-prev" title="上一首（QQ音乐）" aria-label="上一首">«</button>
          <button id="p-toggle" title="播放 / 暂停" aria-label="播放 / 暂停">
            <span class="tri"></span><span class="bars"></span>
          </button>
          <button id="p-next" title="下一首（QQ音乐）" aria-label="下一首">»</button>
        </div>
        <label class="p-vol" title="系统音量">
          <span class="p-vol-ico">♪</span>
          <input id="p-vol" type="range" min="0" max="100" step="1" value="100" aria-label="音量">
          <span id="p-vol-num" class="p-vol-num">100</span>
        </label>
        <button id="p-search-btn" title="搜索 QQ音乐 曲库（结果可复制，粘到客户端搜索框）">搜</button>
        <button id="p-lyric-btn" title="收起侧栏 → 画面中央显示滚动歌词">词</button>
        <button id="p-fold" title="收起 / 展开播放条" aria-label="收起或展开播放条">▾</button>
      </div>
      <div class="p-seek-row">
        <span id="p-cur" class="p-time">0:00</span>
        <input id="p-seek" class="p-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度">
        <span id="p-dur" class="p-time">0:00</span>
      </div>
      <div id="p-search" class="p-search" hidden>
        <button class="wp-pb" data-p="netease">网易云</button>
        <button class="wp-pb" data-p="qq">QQ音乐</button>
        <input id="p-q" placeholder="搜歌名 / 歌手，回车搜索（点结果即播）" autocomplete="off">
        <button id="p-q-go">搜索</button>
      </div>
      <div id="p-results" class="p-results" hidden></div>
    </div>

    <div id="vis-bar" class="vis-bar" aria-hidden="true"></div>

    <form id="composer">
      <div class="composer-wrap">
        <div class="composer-label">絵梨衣の小本子</div>
        <div id="attach-row" class="attach-row" hidden></div>
        <textarea id="input" rows="1" placeholder="写在这里……  Enter 送出，Shift+Enter 换行（可粘贴/拖入图片）" disabled></textarea>
      </div>
      <input type="file" id="file-input" multiple hidden>
      <button type="button" id="btn-attach" title="添加附件（也可直接粘贴或拖入窗口）">＋</button>
      <button type="submit" id="btn-send" class="primary" disabled>送出</button>
    </form>
  </main>

</div>

<div id="lyrics-overlay" class="lyrics-overlay" aria-hidden="true">
  <div class="ly-scroll" id="ly-scroll"></div>
</div>

<div id="cfg" class="cfg" hidden>
  <div class="cfg-box">
    <div class="cfg-head">
      <svg class="mk" aria-hidden="true"><use href="#mk-tree"></use></svg>
      <span class="wp-kind">设置</span><b>界面设置</b><i class="mk-cap">装备部</i>
      <button id="cfg-close" class="wp-x" title="关闭">×</button>
    </div>
    <div class="cfg-body">
      <div class="cfg-row">
        <label>背景亮度 · 白昼<i>会话/听歌界面的壁纸亮度，100 = 原样</i></label>
        <input type="range" id="cfg-dim-hiru" min="40" max="100" step="1">
        <output id="cfg-dim-hiru-out"></output>
      </div>
      <div class="cfg-row">
        <label>背景亮度 · 夜晚<i>同上，夜主题单独一份</i></label>
        <input type="range" id="cfg-dim-yoru" min="40" max="100" step="1">
        <output id="cfg-dim-yoru-out"></output>
      </div>
      <div class="cfg-row">
        <label>背景毛玻璃<i>会话界面背景的模糊半径，0 = 关</i></label>
        <input type="range" id="cfg-blur" min="0" max="60" step="2">
        <output id="cfg-blur-out"></output>
      </div>
      <div class="cfg-row">
        <label>动态壁纸速度<i>收起侧栏时的播放速度（100 = 原速）</i></label>
        <input type="range" id="cfg-rate" min="50" max="130" step="5">
        <output id="cfg-rate-out"></output>
      </div>
      <div class="cfg-row">
        <label>收起时播放动态壁纸<i>关掉就用静态壁纸</i></label>
        <button id="cfg-live" class="cfg-toggle">开</button>
      </div>
      <div class="cfg-row">
        <label>任务栏自动隐藏<i>面板打开且未最小化时隐藏；最小化或关掉开关就恢复显示</i></label>
        <button id="cfg-taskbar" class="cfg-toggle">开</button>
      </div>
      <div class="cfg-row">
        <label>落樱</label>
        <button id="cfg-petals" class="cfg-toggle">开</button>
      </div>
      <div class="cfg-row">
        <label>歌词翻译<i>外文歌词自动附一行中文小字（有道），缓存 7 天</i></label>
        <button id="cfg-zh" class="cfg-toggle">开</button>
      </div>
      <div class="cfg-row">
        <label>动态壁纸<i>选哪张播（昼/夜各自指定）</i></label>
        <button id="cfg-wall">选壁纸…</button>
      </div>
      <div class="cfg-row">
        <label>音乐登录 · 网易云<i>粘贴 music.163.com 的 Cookie（含 MUSIC_U）</i></label>
        <button id="cfg-ck-netease">贴 Cookie</button>
      </div>
      <div class="cfg-row">
        <label>音乐登录 · QQ音乐<i>贴 y.qq.com 的【完整】Cookie（uin / qm_keyst，别截断）</i></label>
        <button id="cfg-ck-qq">贴 Cookie</button>
      </div>
    </div>
    <div class="cfg-foot">
      <span class="muted">设置存在本地，改完立刻生效</span>
      <button id="cfg-reset">恢复默认</button>
    </div>
  </div>
</div>

<div id="wp" class="wp" hidden>
  <div class="wp-box">
    <div class="wp-head">
      <svg class="mk" aria-hidden="true"><use href="#mk-tree"></use></svg>
      <span class="wp-kind">动态壁纸</span><b id="wp-title">选一张</b><i class="mk-cap">尼伯龙根</i>
      <button id="wp-close" class="wp-x" title="关闭">×</button>
    </div>
    <div class="wp-cur muted" id="wp-cur"></div>
    <div class="wp-filters">
      <input id="wp-q" type="search" placeholder="搜索标题 / 文件名…" autocomplete="off">
    </div>
    <div class="wp-list" id="wp-list"></div>
    <div class="wp-foot">
      <span class="muted">「白昼 / 夜晚」＝用在哪套主题；收起侧栏时播放，展开秒停</span>
      <button id="wp-reset">恢复默认</button>
    </div>
  </div>
</div>

<audio id="mus-audio" class="mus-audio" preload="none" hidden></audio>

<div id="mdl" class="wp" hidden>
  <div class="wp-box">
    <div class="wp-head">
      <svg class="mk" aria-hidden="true"><use href="#mk-tree"></use></svg>
      <span class="wp-kind">模型</span><b id="mdl-title">选择模型</b><i class="mk-cap">言灵周期表</i>
      <button id="mdl-close" class="wp-x" title="关闭">×</button>
    </div>
    <input id="mdl-q" class="mdl-q" type="search" placeholder="搜索模型 / 提供方…" autocomplete="off">
    <div class="wp-cur muted" id="mdl-cur"></div>
    <div class="wp-list" id="mdl-list"></div>
    <div class="wp-foot">
      <span class="muted">对当前会话生效；没选会话时 = 新会话默认。带变体的模型可直接点变体</span>
      <button id="mdl-default">用默认模型</button>
    </div>
  </div>
</div>

<div id="ask" class="ask" hidden>
  <div class="ask-box">
    <div class="ask-head">
      <span class="ask-kind" id="ask-kind">需要你选择</span><b id="ask-title"></b>
    </div>
    <div class="ask-body" id="ask-body"></div>
    <div class="ask-actions" id="ask-actions"></div>
  </div>
</div>

<div id="drop-veil" class="drop-veil" hidden>
  <div class="veil-box">松手即可添加附件<br><span>图片支持粘贴（Ctrl+V）或拖入</span></div>
</div>
<script src="/app.js?v=260924p"></script>
</body>
</html>
